name: Build and Release Executables

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Numéro de version à publier (ex. v1.0.0)"
        required: true

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow cairosvg
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        shell: bash

      # Adapte le chemin "plcPlayground_logo.svg" à l'emplacement réel du logo dans ton dépôt.
      - name: Générer l'icône Windows (.ico)
        if: runner.os == 'Windows'
        run: |
          python <<'EOF'
          import io
          import cairosvg
          from PIL import Image

          png = cairosvg.svg2png(url="plcPlayground_logo.svg", output_width=1024, output_height=1024)
          img = Image.open(io.BytesIO(png)).convert("RGBA")
          img.save("icon.ico", sizes=[(16, 16), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)])
          EOF
        shell: bash

      - name: Générer l'icône macOS (.icns)
        if: runner.os == 'macOS'
        run: |
          python <<'EOF'
          import io
          import os
          import cairosvg
          from PIL import Image

          os.makedirs("icon.iconset", exist_ok=True)
          filename_sizes = {
              "icon_16x16.png": 16,
              "icon_16x16@2x.png": 32,
              "icon_32x32.png": 32,
              "icon_32x32@2x.png": 64,
              "icon_128x128.png": 128,
              "icon_128x128@2x.png": 256,
              "icon_256x256.png": 256,
              "icon_256x256@2x.png": 512,
              "icon_512x512.png": 512,
              "icon_512x512@2x.png": 1024,
          }
          for name, size in filename_sizes.items():
              png = cairosvg.svg2png(url="plcPlayground_logo.svg", output_width=size, output_height=size)
              Image.open(io.BytesIO(png)).convert("RGBA").save(f"icon.iconset/{name}")
          EOF
          iconutil -c icns icon.iconset -o icon.icns
        shell: bash

      # Adapte "app.py" au nom réel du fichier d'entrée de ton pont.
      - name: Compiler l'exécutable
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            pyinstaller --onefile --icon=icon.ico app.py
          elif [ "$RUNNER_OS" == "macOS" ]; then
            pyinstaller --onefile --icon=icon.icns app.py
          else
            pyinstaller --onefile app.py
          fi
        shell: bash

      - name: Renommer l'exécutable selon le système
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            mv dist/app.exe dist/plc-playground-bridge-windows.exe
          elif [ "$RUNNER_OS" == "Linux" ]; then
            mv dist/app dist/plc-playground-bridge-linux
          elif [ "$RUNNER_OS" == "macOS" ]; then
            mv dist/app dist/plc-playground-bridge-macos
          fi
        shell: bash

      - name: Téléverser l'exécutable comme artefact temporaire
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Télécharger tous les exécutables compilés
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publier la release GitHub avec les exécutables
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
