name: Build and Release Executables

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Numéro de version à publier (ex. v1.0.0)"
        required: true

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        shell: bash

      # Adapte "app.py" au nom réel du fichier d'entrée de ton pont.
      - name: Compiler l'exécutable
        run: pyinstaller --onefile app.py
        shell: bash

      - name: Renommer l'exécutable selon le système
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            mv dist/app.exe dist/plc-playground-bridge-windows.exe
          elif [ "$RUNNER_OS" == "Linux" ]; then
            mv dist/app dist/plc-playground-bridge-linux
          elif [ "$RUNNER_OS" == "macOS" ]; then
            mv dist/app dist/plc-playground-bridge-macos
          fi
        shell: bash

      - name: Téléverser l'exécutable comme artefact temporaire
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Télécharger tous les exécutables compilés
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publier la release GitHub avec les exécutables
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
